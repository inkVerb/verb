##
## Settings for the Sieve interpreter (Dovecot 2.4)
##

sieve_extensions = +spamtest +spamtestplus

sieve_spamtest_status_type = score
sieve_spamtest_status_header = X-Spam_score: (-?[[:digit:]]+\.[[:digit:]]).*
sieve_spamtest_score_max_value = 5.0

sieve_script before {
  path = /var/lib/dovecot/sieve/global_sieves/move_to_spam_folder.sieve
}